# E11-T03: error telemetry is a no-op with an empty DSN. Request/transaction bodies are never collected.
sentry:
  dsn: ${SENTRY_DSN:}
  send-default-pii: false
  max-request-body-size: none
  traces-sample-rate: 0.0
  enable-logs: false

app:
  dashboard:
    cacheSeconds: 60

signup:
  capability-key: ${SIGNUP_CAPABILITY_KEY:}
bookings:
  calendar-key: ${BOOKING_CALENDAR_KEY:}
exports:
  local-directory: ${EXPORT_LOCAL_DIRECTORY:./.local/exports}
  signing-key: ${EXPORT_SIGNING_KEY:}
  s3:
    bucket: ${EXPORT_S3_BUCKET:}
    region: ${EXPORT_S3_REGION:}
    endpoint: ${EXPORT_S3_ENDPOINT:}
    access-key: ${EXPORT_S3_ACCESS_KEY:}
    secret-key: ${EXPORT_S3_SECRET_KEY:}

email:
  local-mailbox-directory: ${MAIL_LOCAL_DIRECTORY:}
  platform-from: ${MAIL_FROM_PLATFORM:}
  sendgrid:
    api-key: ${SENDGRID_API_KEY:}
    webhook-public-key: ${SENDGRID_WEBHOOK_PUBLIC_KEY:}

# S11 notification engine (E7-T02): SMS (Twilio), web push (VAPID) and the signed CLUB_NEWS unsubscribe links.
notifications:
  unsubscribe-key: ${EMAIL_UNSUBSCRIBE_KEY:}
  sms:
    twilio-account-sid: ${TWILIO_ACCOUNT_SID:}
    twilio-auth-token: ${TWILIO_AUTH_TOKEN:}
    twilio-messaging-service-sid: ${TWILIO_MESSAGING_SERVICE_SID:}
    allowed-numbers: ${SMS_ALLOWED_NUMBERS:}
  push:
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
    vapid-subject: ${VAPID_SUBJECT:}

identity:
  issuer: ${AUTH_ISSUER:https://id.agilitydoghub.com}
  seed-password: ${SEED_PASSWORD:}

agilityhub:
  legal:
    privacyPolicyVersion: ${PLATFORM_PRIVACY_POLICY_VERSION:v1}
    privacyPolicyUrl: ${PLATFORM_PRIVACY_POLICY_URL:https://id.agilitydoghub.com/privacy}

spring:
  application:
    name: agilityhub-core-api
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # Empty trusts no proxy. Deployments must explicitly identify their Caddy peers.
      internal-proxies: ${TRUSTED_PROXY_PATTERN:}

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

core:
  # E11-T03 infrastructure bounds; HTTP budgets do not limit background transaction lifetimes (E85).
  mongo:
    connect-timeout: ${MONGO_CONNECT_TIMEOUT:2s}
    socket-timeout: ${MONGO_SOCKET_TIMEOUT:0s}
    server-selection-timeout: ${MONGO_SERVER_SELECTION_TIMEOUT:2s}
    operation-timeout: ${MONGO_OPERATION_TIMEOUT:10s}
    max-pool-size: ${MONGO_MAX_POOL_SIZE:100}
    pool-wait-timeout: ${MONGO_POOL_WAIT_TIMEOUT:2s}
  concurrency:
    # R1 runs a single API instance (ADR-003). The local lanes only bound contention inside one process; with more
    # than one instance they protect nothing and the Mongo mechanisms (the $inc sequences with WriteConflict retries,
    # the partial unique index training_active_seat, the ring-slot sequences) are the guarantee. Infrastructure
    # setting, not a club parameter (shared.application.LocalLanes).
    local-lanes: true
  migration:
    bank-key: ${MIGRATION_BANK_KEY:}
  billing:
    # Ruling E43 (E8-T01): BankAccountVault, the one key of the members' encrypted IBANs (both origins); only the SEPA writer decrypts.
    bank-key: ${BILLING_BANK_KEY:}
  oidc:
    master-key: ${OIDC_MASTER_KEY:}
    login-url: ${OIDC_LOGIN_URL:https://id.agilitydoghub.com/login}
    clients:
      - id: clubs-app
        token-delivery: COOKIE
        redirect-uris: ["${OIDC_CLUBS_APP_REDIRECT_URI:https://clubs.agilitydoghub.com/oidc/callback}"]
        post-logout-redirect-uris: ["${OIDC_CLUBS_APP_LOGOUT_URI:https://clubs.agilitydoghub.com/}"]
        scopes: [openid, profile, email, memberships, offline_access]
        grants: [authorization_code, password, "urn:agilityhub:grant:magic-link", "urn:agilityhub:grant:handoff", refresh_token]
      - id: clubs-admin
        token-delivery: COOKIE
        redirect-uris: ["${OIDC_CLUBS_ADMIN_REDIRECT_URI:https://clubsadmin.agilitydoghub.com/oidc/callback}"]
        post-logout-redirect-uris: ["${OIDC_CLUBS_ADMIN_LOGOUT_URI:https://clubsadmin.agilitydoghub.com/}"]
        scopes: [openid, profile, email, memberships, offline_access]
        grants: [authorization_code, password, "urn:agilityhub:grant:magic-link", "urn:agilityhub:grant:handoff", refresh_token]
      - id: id-web
        token-delivery: COOKIE
        redirect-uris: ["${OIDC_ID_WEB_REDIRECT_URI:https://id.agilitydoghub.com/oidc/callback}"]
        post-logout-redirect-uris: ["${OIDC_ID_WEB_LOGOUT_URI:https://id.agilitydoghub.com/}"]
        scopes: [openid, profile, email, memberships, offline_access]
        grants: [authorization_code, password, "urn:agilityhub:grant:magic-link", refresh_token]
      - id: ar-app
        token-delivery: BODY
        redirect-uris: ["${OIDC_AR_APP_REDIRECT_URI:https://ar.agilitydoghub.com/oidc/callback}"]
        post-logout-redirect-uris: ["${OIDC_AR_APP_LOGOUT_URI:https://ar.agilitydoghub.com/}"]
        scopes: [openid, profile, email, memberships, offline_access]
        grants: [authorization_code, refresh_token]
      - id: learn
        token-delivery: BODY
        confidential: true
        secret: ${OIDC_LEARN_CLIENT_SECRET:}
        redirect-uris: ["${OIDC_LEARN_REDIRECT_URI:https://learn.agilitydoghub.com/oidc/callback}"]
        post-logout-redirect-uris: ["${OIDC_LEARN_LOGOUT_URI:https://learn.agilitydoghub.com/}"]
        scopes: [openid, profile, email, memberships, offline_access, "accounts:write"]
        grants: [authorization_code, password, refresh_token]
  security:
    rateLimits:
      enabled: true
      token: {capacity: 30, period: 1m}
      branding: {capacity: 120, period: 1m}
      public-routes: {capacity: 60, period: 1m}
      me: {capacity: 600, period: 1m}
      # E11-T03: independent per-IP buckets; handoff also per account, token-account across IPs.
      anonymous: {capacity: 120, period: 1m}
      webhook: {capacity: 600, period: 1m}
      signed-file: {capacity: 120, period: 1m}
      handoff: {capacity: 30, period: 1m}
      token-account: {capacity: 10, period: 1m}
      magic-link-email: {capacity: 10, period: 1h}
      magic-link-ip: {capacity: 60, period: 1h}
    cors:
      platform-hosts: ${CORS_PLATFORM_HOSTS:id.agilitydoghub.com,clubs.agilitydoghub.com,clubsadmin.agilitydoghub.com}

springdoc:
  api-docs:
    enabled: false
    path: /api/v1/openapi.json
    version: OPENAPI_3_1
  override-with-generic-response: false
  default-produces-media-type: application/json
  swagger-ui:
    enabled: false

attachments:
  local-directory: ${ATTACHMENT_LOCAL_DIRECTORY:./.local/attachments}
  s3:
    bucket: ${ATTACHMENT_S3_BUCKET:}
    region: ${ATTACHMENT_S3_REGION:}
    endpoint: ${ATTACHMENT_S3_ENDPOINT:}
    access-key: ${ATTACHMENT_S3_ACCESS_KEY:}
    secret-key: ${ATTACHMENT_S3_SECRET_KEY:}

---
spring:
  config:
    activate:
      on-profile: local
  data:
    mongodb:
      # Direct connection also works from the host, where Compose's mongo DNS is unavailable.
      uri: mongodb://${MONGODB_HOST:localhost}:${MONGODB_PORT:27017}/${MONGODB_DATABASE:agilityhub}?replicaSet=${MONGODB_REPLICA_SET:rs0}&directConnection=true

springdoc:
  api-docs:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: test
  data:
    mongodb:
      uri: ${MONGODB_TEST_URI:mongodb://localhost:27017/agilityhub_test?replicaSet=rs0&directConnection=true}

attachments:
  local-directory: ./target/test-attachments

exports:
  local-directory: ./target/test-exports

core:
  security:
    rateLimits:
      enabled: false

springdoc:
  api-docs:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: staging | prod
  data:
    mongodb:
      host: ${MONGODB_HOST}
      port: ${MONGODB_PORT:27017}
      database: ${MONGODB_DATABASE}
      replica-set-name: ${MONGODB_REPLICA_SET:rs0}
      authentication-database: ${MONGODB_AUTH_DATABASE:admin}
      username: ${MONGODB_USERNAME}
      password: ${MONGODB_PASSWORD}

springdoc:
  api-docs:
    enabled: false

# E11-T03: Spring Boot JSON console output in production; local/test keep readable, scrubbed output.
logging:
  structured:
    format:
      console: com.agilityhub.core.configuration.PrivacyLogFormatter
