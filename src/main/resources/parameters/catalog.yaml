  - key: "signup.text.paymentDay"
    type: "localizedText"
    default: {"ca": "Quan ja no vulguis seguir fent activitats al club o vulguis estar un temps sense venir, indica'ns-ho abans del dia {deadlineDay} per modificar l'emissió de rebuts del mes següent. Ho pots fer des de la teva fitxa o bé contactant-nos directament.", "es": "Cuando ya no quieras seguir haciendo actividades en el club o quieras estar un tiempo sin venir, indícanoslo antes del día {deadlineDay} para modificar la emisión de recibos del mes siguiente. Puedes hacerlo desde tu ficha o contactando con nosotros directamente.", "en": "When you no longer want to train at the club, or you want to take a break, let us know before day {deadlineDay} so we can change the following month's billing. You can do it from your profile or by contacting us."}
    block: "signup"
    labelKey: "admin-settings:param.signup.text.paymentDay.label"
    helpKey: "admin-settings:param.signup.text.paymentDay.help"
    constraints: {}
    modules: []
    scope: "club"
    editableBy: "CLUB"
    restartRequired: false
    documentType: "localizedText"
    documentDefault: "`{\"ca\": \"Quan ja no vulguis seguir fent activitats al club o vulguis estar un temps sense venir, indica'ns-ho abans del dia {deadlineDay} per modificar l'emissió de rebuts del mes següent. Ho pots fer des de la teva fitxa o bé contactant-nos directament.\", \"es\": \"Cuando ya no quieras seguir haciendo actividades en el club o quieras estar un tiempo sin venir, indícanoslo antes del día {deadlineDay} para modificar la emisión de recibos del mes siguiente. Puedes hacerlo desde tu ficha o contactando con nosotros directamente.\", \"en\": \"When you no longer want to train at the club, or you want to take a break, let us know before day {deadlineDay} so we can change the following month's billing. You can do it from your profile or by contacting us.\"}`"
  - key: "signup.text.cashConditions"
