    default: {"ca": "Pagament en efectiu: la quota es paga per semestres naturals complets al club. Posa't en contacte amb el club per coordinar-ho.", "es": "Pago en efectivo: la cuota se paga por semestres naturales completos en el club. Ponte en contacto con el club para coordinarlo.", "en": "Cash payment: the fee is paid at the club in full calendar half-years. Contact the club to arrange this."}
    block: "signup"
    labelKey: "admin-settings:param.signup.text.cashConditions.label"
    helpKey: "admin-settings:param.signup.text.cashConditions.help"
    constraints: {}
    modules: []
    scope: "club"
    editableBy: "CLUB"
    restartRequired: false
    documentType: "localizedText"
    documentDefault: "`{\"ca\": \"Pagament en efectiu: la quota es paga per semestres naturals complets al club. Posa't en contacte amb el club per coordinar-ho.\", \"es\": \"Pago en efectivo: la cuota se paga por semestres naturales completos en el club. Ponte en contacto con el club para coordinarlo.\", \"en\": \"Cash payment: the fee is paid at the club in full calendar half-years. Contact the club to arrange this.\"}`"
  - key: "signup.text.freeTrainingConditions"
    type: "localizedText"
    default: {"ca": "Les classes són sempre amb instructor i se'n poden fer fins a dues per setmana. A més hi ha la possibilitat d'entrenament lliure fora d'hores de classe a partir de nivell D amb llicència esportiva.", "es": "Las clases son siempre con instructor y se pueden hacer hasta dos por semana. Además, existe la posibilidad de entrenamiento libre fuera del horario de clases a partir del nivel D con licencia deportiva.", "en": "Classes always have an instructor, with up to two classes per week. Free training outside class hours is also available from level D with a sports licence."}
    block: "signup"
    labelKey: "admin-settings:param.signup.text.freeTrainingConditions.label"
    helpKey: "admin-settings:param.signup.text.freeTrainingConditions.help"
    constraints: {}
    modules: []
    scope: "club"
    editableBy: "CLUB"
    restartRequired: false
    documentType: "localizedText"
    documentDefault: "`{\"ca\": \"Les classes són sempre amb instructor i se'n poden fer fins a dues per setmana. A més hi ha la possibilitat d'entrenament lliure fora d'hores de classe a partir de nivell D amb llicència esportiva.\", \"es\": \"Las clases son siempre con instructor y se pueden hacer hasta dos por semana. Además, existe la posibilidad de entrenamiento libre fuera del horario de clases a partir del nivel D con licencia deportiva.\", \"en\": \"Classes always have an instructor, with up to two classes per week. Free training outside class hours is also available from level D with a sports licence.\"}`"
