<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${language}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${title}">Title</title></head>
<body style="margin:0;background:#f4f5f7;font-family:Arial,sans-serif;color:#18212f">
<table role="presentation" style="width:100%;padding:32px 16px"><tr><td align="center">
<table role="presentation" style="width:100%;max-width:560px;background:#ffffff;border-radius:12px;padding:32px"><tr><td>
<img th:if="${logo != null}" th:src="${logo}" th:alt="${brand}" style="max-height:64px;max-width:200px">
<p th:text="${brand}" style="font-weight:bold;font-size:18px">Club</p>
<h1 th:text="${title}" style="font-size:24px;line-height:1.3">Title</h1>
<p th:each="paragraph : ${paragraphs}" th:text="${paragraph}" style="font-size:16px;line-height:1.6">Body</p>
<p th:if="${link != null}" style="margin:28px 0"><a th:href="${link}" th:text="${action}" th:style="|display:inline-block;padding:14px 24px;border-radius:6px;text-decoration:none;background:${primary};color:${onPrimary}|">Open</a></p>
<p th:if="${calendar != null}" style="font-size:14px"><a th:href="${calendar}" th:text="${calendarLabel}">Calendar</a></p>
<hr style="border:0;border-top:1px solid #e5e7eb;margin-top:32px">
<p th:text="${reply}" style="font-size:12px;line-height:1.5;color:#526070">Reply to contact the club.</p>
<p th:if="${unsubscribe != null}" style="font-size:12px;line-height:1.5"><a th:href="${unsubscribe}" th:text="${unsubscribeLabel}" style="color:#526070">Unsubscribe</a></p>
</td></tr></table></td></tr></table>
</body></html>
