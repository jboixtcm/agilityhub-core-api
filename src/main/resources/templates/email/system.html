<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${language}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${title}">AgilityHub</title></head>
<body style="margin:0;background:#f4f5f7;font-family:Arial,sans-serif;color:#18212f">
<table role="presentation" style="width:100%;padding:32px 16px"><tr><td align="center">
<table role="presentation" style="width:100%;max-width:560px;background:#ffffff;border-radius:12px;padding:32px"><tr><td>
<img th:if="${logo != null}" th:src="${logo}" th:alt="${brand}" style="max-height:64px;max-width:200px">
<p th:text="${brand}" style="font-weight:bold;font-size:18px">AgilityHub</p>
<h1 th:text="${title}" style="font-size:26px;line-height:1.25">Title</h1>
<p th:text="${body}" style="font-size:16px;line-height:1.6">Body</p>
<div th:if="${link != null}">
<p style="margin:28px 0"><a th:href="${link}" th:text="${action}" th:style="|display:inline-block;padding:14px 24px;border-radius:6px;text-decoration:none;background:${primary};color:${onPrimary}|">Sign in</a></p>
<p th:text="${expiry}" style="font-size:14px;color:#526070">Expiry</p>
<p style="font-size:12px;word-break:break-all"><a th:href="${link}" th:text="${link}">Link</a></p>
</div>
<hr style="border:0;border-top:1px solid #e5e7eb;margin-top:32px">
<p th:text="${footer}" style="font-size:12px;line-height:1.5;color:#526070">Account security message.</p>
</td></tr></table></td></tr></table>
</body></html>
