name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Every push gets its own group (even pending runs survive); only superseded PRs cancel.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check Docker for Testcontainers
        run: docker info
      - name: Build, test, and enforce coverage
        run: ./mvnw -B clean verify
      - name: Upload JaCoCo HTML report
        if: always() && hashFiles('target/site/jacoco/index.html') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: error
          retention-days: 14
      - name: Regenerate OpenAPI snapshot
        run: bin/openapi-snapshot --from-build
      - name: Check OpenAPI snapshot diff
        run: |
          git diff --exit-code docs/openapi/openapi.json || {
            echo 'run bin/openapi-snapshot and review the diff'
            exit 1
          }

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_ENABLE_COMMENTS: 'false'
      - name: Prove evidence exceptions cannot hide credentials
        run: python3 bin/security-secret-policy-test.py

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Resolve and package the actual runtime dependencies
        run: ./mvnw -B -q -DskipTests package
      - name: Prove the scan policy and audit packaged dependencies
        run: |
          python3 bin/security-scan-test.py
          bin/security-scan rootfs target

  security-image:
    name: Scan image (${{ matrix.arch }})
    needs: [tests, secrets, dependency-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image that will be scanned and pushed
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: ghcr.io/jboixtcm/agilityhub-core-api:ci-${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=core-api-${{ matrix.arch }}
          cache-to: type=gha,scope=core-api-${{ matrix.arch }},mode=max
      - name: Scan image secrets and fixable CRITICAL vulnerabilities
        run: bin/security-scan image ghcr.io/jboixtcm/agilityhub-core-api:ci-${{ github.sha }}-${{ matrix.arch }}
      - name: Compose startup, HTTPS headers, CORS, logs, health and branding
        if: matrix.arch == 'amd64'
        run: bin/deploy-smoke --image-tag ci-${{ github.sha }}-${{ matrix.arch }} --security-only
      - name: Prove the compose smoke rejects an image that cannot start
        if: matrix.arch == 'amd64'
        shell: bash
        run: |
          docker build -t ghcr.io/jboixtcm/agilityhub-core-api:ci-broken --file - . <<'DOCKERFILE'
          FROM ghcr.io/jboixtcm/agilityhub-core-api:ci-${{ github.sha }}-${{ matrix.arch }}
          ENTRYPOINT ["/bin/false"]
          DOCKERFILE
          if bin/deploy-smoke --image-tag ci-broken --security-only > compose-negative.log 2>&1; then
            cat compose-negative.log
            echo 'ERROR: the compose smoke accepted a broken image'
            exit 1
          fi
          tail -n 40 compose-negative.log
          echo 'PASS: the compose smoke refused the broken image' >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the exact scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ghcr.io/jboixtcm/agilityhub-core-api:ci-${{ github.sha }}-${{ matrix.arch }}

  publish-image:
    name: Publish API image
    needs: [security-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish only the two scanned image digests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image=ghcr.io/jboixtcm/agilityhub-core-api
          docker buildx imagetools create --tag "$image:sha-${GITHUB_SHA::7}" \
            "$image:ci-$GITHUB_SHA-amd64" "$image:ci-$GITHUB_SHA-arm64"
          # An older successful run still publishes its immutable tag, but cannot replace the current main image.
          latest=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$latest" == "$GITHUB_SHA" ]]; then
            docker buildx imagetools create --tag "$image:main" "$image:sha-${GITHUB_SHA::7}"
          fi
