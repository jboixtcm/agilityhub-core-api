# Gitleaks configuration (CI "Secret scan" job). Extends the default rules.
[extend]
useDefault = true

[[allowlists]]
description = "Roadmap reports are prose and command outputs with truncated tokens (organizer-reviewed); the generic-api-key rule matches test descriptions there. Code and resources stay fully scanned."
paths = [
  '''roadmap/tasks/.*\.md$''',
  '''roadmap/MESSAGES\.md$''',
]

[[allowlists]]
description = "These two tests construct an ephemeral RSA PEM from a generated key; no key material is checked in."
targetRules = ["private-key"]
condition = "AND"
paths = ['''src/test/java/com/agilityhub/core/(identity/api/SecurityHeadersIT|configuration/JwtConfigurationTest)\.java$''']
regexTarget = "line"
regexes = ['''String pem = "-----BEGIN PRIVATE KEY-----\\n" \+ Base64\.getMimeEncoder''']

[[allowlists]]
description = "Notification evidence logs print dedupKey values: fictional, event-derived deduplication keys, not secrets. The generic-api-key rule matched one in E7-T01's round 2 (organizer, 28-09). Code and resources stay fully scanned."
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''roadmap/evidence/.*\.log$''']
regexTarget = "match"
regexes = ['''(?i)^dedupKey['"]?\s*[:=]\s*['"]?[^'"\s,}]+['"]?$''']

[[allowlists]]
description = "E11-T03: UUID request trace and idempotency identifiers in test evidence are not credentials. Match only the identifier, never a whole log line."
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''roadmap/evidence/.*\.log$''']
regexTarget = "match"
regexes = [
  '''^o\.springdoc\.api\.AbstractOpenApiResource traceId=[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\s*$''',
  '''^Idempotency-Key:"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"$''',
]

[[allowlists]]
description = "E11-T03: the scanner joins two empty example assignments and mistakes the second variable name for a key."
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)\.env\.example$''']
regexTarget = "match"
regexes = ['''^ATTACHMENT_S3_ACCESS_KEY=\nATTACHMENT_S3_SECRET_KEY=$''']

[[allowlists]]
description = "E11-T03: this exact export test argument is a fictional XML filename, not a credential; adjacent or changed values remain scanned."
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''src/test/java/com/agilityhub/core/clubs/common/application/ExportFileStoreAdapterTest\.java$''']
regexTarget = "match"
regexes = ['''^key", "remesa-2026-09\.xml"$''']
