# Fictional club definition. Provider configuration is supplied in later stages.
apiVersion: "agilityhub.club/v1"
club:
  slug: "minim"
  name: "Club Mínim"
  locales:
    - "en"
  defaultLocale: "en"
  timeZone: "UTC"
  currency: "EUR"
  countryProfile: "GENERIC"
  status: "ONBOARDING"
  template: false
  contactEmail: "minim@example.test"
domains:
  -
    host: "minim.example.test"
    app: "clubs"
    primary: true
theme:
  colors:
    primary: "#2563EB"
    onPrimary: "#FFFFFF"
    background: "#F8FAFC"
    surface: "#FFFFFF"
    surfaceAlt: "#F1F5F9"
    text: "#0F172A"
    textMuted: "#475569"
    border: "#CBD5E1"
    success: "#15803D"
    warning: "#A16207"
    danger: "#B91C1C"
    info: "#0369A1"
  fontFamily: "system-ui"
  radius: "8px"
  ringPalette: []
  mode: "light"
preset: "MINIM"
paymentProviders:
  - "STRIPE"
  - "MANUAL"
parameters:
  messaging.email.fromName: "Club Mínim"
# Fictional identities only. Password values come from the process environment.
accounts:
  - email: "minim.admin@example.test"
    name: "Núria Example"
    locale: "en"
    roles: ["ADMIN"]
    password: "${SEED_PASSWORD}"
    onboardingPending: false
  - email: "minim.member@example.test"
    name: "Roc Example"
    locale: "en"
    roles: ["MEMBER"]
    password: "${SEED_PASSWORD}"
    onboardingPending: false
  - email: "minim.member.2@example.test"
    name: "Queralt Example"
    locale: "en"
    roles: ["MEMBER"]
    password: "${SEED_PASSWORD}"
    onboardingPending: false
catalogs:
  levels: []
  rings: []
  instructors: []
  plans: []
  prices: []
  faq: []
messageTemplates: []
