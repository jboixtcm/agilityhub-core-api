# Fictional club definition. Provider configuration is supplied in later stages.
# The AgilityHub template club (S17 R-17-08 and R-17-13; A41.1, ruling E153): a generic starter set in ca/es/en that D19's
# «Catàlegs base» clones part by part into an empty club, which then edits everything (D8, D9, D11, D16). No text names a club.
apiVersion: "agilityhub.club/v1"
club:
  slug: "club-template-default"
  name: "AgilityHub template"
  locales:
    - "ca"
    - "es"
    - "en"
  defaultLocale: "en"
  timeZone: "UTC"
  currency: "EUR"
  countryProfile: "GENERIC"
  status: "ONBOARDING"
  template: true
  contactEmail: "template@example.test"
domains: []
theme:
  # The AgilityHub brand (ruling E157): the same theme as the product `/branding` (src/main/resources/platform/
  # product-branding.json) and the web's «AgilityHub» light preset (E161); R-17-06 compares a club's colours with these.
  colors:
    primary: "#1d1d1f"
    onPrimary: "#ffffff"
    background: "#ffffff"
    surface: "#ffffff"
    surfaceAlt: "#f1f1f2"
    text: "#1d1d1f"
    textMuted: "#656567"
    border: "#d6d6d7"
    success: "#4caf7d"
    warning: "#e5b93c"
    danger: "#e05b5b"
    info: "#85b8e8"
  fontFamily: "Montserrat"
  radius: "8px"
  ringPalette: []
  mode: "light"
# The modules the template's own catalogs need: plans of the three types with their prices (PACKS and SINGLE_CLASS need
# BILLING) and free training on its rings. A club that clones the plans needs PACKS and SINGLE_CLASS too (seeds/README.md).
modules:
  - "FREE_TRAINING"
  - "BILLING"
  - "PACKS"
  - "SINGLE_CLASS"
  - "WAITLIST"
  - "FAQ"
  - "PUSH"
paymentProviders: []
parameters: {}
admins: []
catalogs:
  # S05 §3, with the semantics of S05 §12's seed rows (E29, B32): Teràpia and Pendent stay outside the progression; free training
  # from the advanced level.
  levels:
    - code: "CAD"
      name: {ca: "Cadells", es: "Cachorros", en: "Puppies"}
      order: 0
      color: "#F5D67A"
      capacity: 5
      grantsFreeTraining: false
      progression: true
      active: true
    - code: "INI"
      name: {ca: "Iniciació", es: "Iniciación", en: "Beginners"}
      order: 10
      color: "#C9E4F5"
      capacity: 5
      grantsFreeTraining: false
      progression: true
      active: true
    - code: "INT"
      name: {ca: "Intermedi", es: "Intermedio", en: "Intermediate"}
      order: 20
      color: "#85B8E8"
      capacity: 5
      grantsFreeTraining: false
      progression: true
      active: true
    - code: "AVA"
      name: {ca: "Avançat", es: "Avanzado", en: "Advanced"}
      order: 30
      color: "#8FCE8F"
      capacity: 4
      grantsFreeTraining: true
      progression: true
      active: true
    - code: "TER"
      name: {ca: "Teràpia", es: "Terapia", en: "Therapy"}
      order: 40
      color: "#C9CDD3"
      capacity: 1
      grantsFreeTraining: false
      progression: false
      active: true
    - code: "PENDENT"
      name: {ca: "Pendent", es: "Pendiente", en: "Pending"}
      order: 50
      color: "#9AA0A6"
      capacity: 5
      grantsFreeTraining: false
      progression: false
      active: true
  # A ring's name is one text (S05 §3): «Pista» reads the same in ca and es; a club renames its rings and draws them at D16.
  rings:
    - name: "Pista 1"
      shortName: "P1"
      color: "#85B8E8"
      allowsFreeTraining: true
      trainingCapacity: null
      order: 0
      active: true
    - name: "Pista 2"
      shortName: "P2"
      color: "#8FCE8F"
      allowsFreeTraining: true
      trainingCapacity: null
      order: 10
      active: true
  instructors: []
  # S05 §3: the entry fee per dog is `billing.entryFeePerDog` (STANDARD; THERAPY 50 % of it), the additional dog the family
  # fare (`billing.familyDiscountPercentFromSecondDog`). Amounts: S05 §12's current ones; the single class, a tenth of the
  # 10-session pack. A club edits them at D8.
  plans:
    - code: "MONTHLY"
      name: {ca: "Abonament mensual", es: "Abono mensual", en: "Monthly membership"}
      type: "MONTHLY"
      billingMode: "MONTHLY_FEE"
      dogsIncluded: 1
      entryFee: {mode: "STANDARD"}
      showOnSignup: true
      showOnWeb: true
      order: 0
      active: true
    - code: "MONTHLY_FAMILY"
      name: {ca: "Abonament mensual · 2 gossos (familiar)", es: "Abono mensual · 2 perros (familiar)", en: "Monthly membership · 2 dogs (family)"}
      type: "MONTHLY"
      billingMode: "MONTHLY_FEE"
      dogsIncluded: 2
      entryFee: {mode: "STANDARD"}
      conditions:
        ca: "50% de la quota a partir del 2n gos · pagador únic del grup"
        es: "50% de la cuota a partir del segundo perro · pagador único del grupo"
        en: "50% of the fee from the second dog · one payer for the group"
      showOnSignup: false
      showOnWeb: true
      order: 10
      active: true
    - code: "PACK10"
      name: {ca: "Pack de 10 sessions", es: "Bono de 10 sesiones", en: "10-session pack"}
      type: "PACK"
      dogsIncluded: 1
      entryFee: {mode: "NONE"}
      pack: {sessions: 10, validityMonths: 5}
      showOnSignup: true
      showOnWeb: true
      order: 20
      active: true
    - code: "SINGLE_CLASS"
      name: {ca: "Classe solta", es: "Clase suelta", en: "Single class"}
      type: "SINGLE_CLASS"
      dogsIncluded: 1
      entryFee: {mode: "NONE"}
      singleClass: {chargeMode: "CHARGE_ON_ATTENDANCE", cancelPolicy: "REFUND"}
      showOnSignup: true
      showOnWeb: true
      order: 30
      active: true
    - code: "THERAPY"
      name: {ca: "Teràpia", es: "Terapia", en: "Therapy"}
      type: "MONTHLY"
      billingMode: "MAINTENANCE"
      dogsIncluded: 1
      entryFee: {mode: "PERCENT", percent: 50}
      conditions:
        ca: "pagament inicial a compte del 50% de l'entrada i quota manteniment en tant no es faci classe en grup"
        es: "pago inicial a cuenta del 50% de la entrada y cuota de mantenimiento mientras no se hagan clases en grupo"
        en: "initial payment on account of 50% of the entry fee and a maintenance fee while there are no group classes"
      texts:
        priceLabel: {ca: "condicions i cost segons cada cas", es: "condiciones y coste según cada caso", en: "terms and cost depending on each case"}
      showOnSignup: true
      showOnWeb: true
      order: 40
      active: true
  prices:
    - planCode: "MONTHLY"
      concept: "MONTHLY_FEE"
      amount: {amountMinor: 6000, currency: "EUR"}
      taxPercent: 0
      validFrom: "2026-01-01"
      validTo: null
    - planCode: "MONTHLY_FAMILY"
      concept: "MONTHLY_FEE"
      amount: {amountMinor: 9000, currency: "EUR"}
      taxPercent: 0
      validFrom: "2026-01-01"
      validTo: null
    - planCode: "PACK10"
      concept: "PACK"
      amount: {amountMinor: 18000, currency: "EUR"}
      taxPercent: 0
      validFrom: "2026-01-01"
      validTo: null
    - planCode: "SINGLE_CLASS"
      concept: "SINGLE_CLASS"
      amount: {amountMinor: 1800, currency: "EUR"}
      taxPercent: 0
      validFrom: "2026-01-01"
      validTo: null
    - planCode: "THERAPY"
      concept: "MAINTENANCE_FEE"
      amount: {amountMinor: 1000, currency: "EUR"}
      taxPercent: 0
      validFrom: "2026-01-01"
      validTo: null
  # R-05-21b: one entry per FAQ category of S05 §12's seed, its answer the provisional marker, active so that the club sees it
  # and writes its own answer at D11.
  faq:
    - code: "FAQ_CLUB_LIFE"
      category: {ca: "Convivència al club", es: "Convivencia en el club", en: "Life at the club"}
      question: {ca: "Puc venir amb més gent al club?", es: "¿Puedo venir con más gente al club?", en: "Can I bring other people to the club?"}
      answer:
        ca: "[Text pendent — el club l'omplirà des de Paràmetres]"
        es: "[Text pendent — el club l'omplirà des de Paràmetres]"
        en: "[Text pendent — el club l'omplirà des de Paràmetres]"
      order: 0
      active: true
    - code: "FAQ_BOOKINGS"
      category: {ca: "Reserves de classe", es: "Reservas de clase", en: "Class bookings"}
      question: {ca: "Quantes classes puc reservar i en quin moment?", es: "¿Cuántas clases puedo reservar y cuándo?", en: "How many classes can I book, and when?"}
      answer:
        ca: "[Text pendent — el club l'omplirà des de Paràmetres]"
        es: "[Text pendent — el club l'omplirà des de Paràmetres]"
        en: "[Text pendent — el club l'omplirà des de Paràmetres]"
      order: 10
      active: true
    - code: "FAQ_COMPETITIONS"
      category: {ca: "Competicions", es: "Competiciones", en: "Competitions"}
      question: {ca: "Què cal per poder participar a competicions d'agility?", es: "¿Qué necesito para participar en competiciones de agility?", en: "What do I need to take part in agility competitions?"}
      answer:
        ca: "[Text pendent — el club l'omplirà des de Paràmetres]"
        es: "[Text pendent — el club l'omplirà des de Paràmetres]"
        en: "[Text pendent — el club l'omplirà des de Paràmetres]"
      order: 20
      active: true
