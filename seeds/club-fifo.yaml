# E5-T06: fictional second club for the E5 gate (S08 R-08-14 FIFO waiting list, S08 R-08-18 PAY_TO_BOOK single classes,
# S15 P6 waitlist-fifo and P7 payment-timeouts). Not the Cànic: one ring, one level, levels off, FIFO, SINGLE_CLASS on.
# Its demo data is seeds/demo-fifo.yaml (bin/core seed:demo --club=fifo); bin/e5-smoke applies both.
apiVersion: "agilityhub.club/v1"
club:
  slug: "fifo"
  name: "Club Fictici Cua"
  locales:
    - "ca"
    - "es"
  defaultLocale: "ca"
  timeZone: "Europe/Madrid"
  currency: "EUR"
  countryProfile: "ES"
  status: "ONBOARDING"
  template: false
  contactEmail: "fifo@example.test"
domains:
  -
    host: "fifo.example.test"
    app: "clubs"
    primary: true
theme:
  colors:
    primary: "#2563EB"
    onPrimary: "#FFFFFF"
    background: "#F8FAFC"
    surface: "#FFFFFF"
    surfaceAlt: "#F1F5F9"
    text: "#0F172A"
    textMuted: "#475569"
    border: "#CBD5E1"
    success: "#15803D"
    warning: "#A16207"
    danger: "#B91C1C"
    info: "#0369A1"
  fontFamily: "system-ui"
  radius: "8px"
  ringPalette: []
  mode: "light"
modules:
  - "BILLING"
  - "SINGLE_CLASS"
  - "WAITLIST"
  - "FAQ"
  - "PUSH"
paymentProviders:
  STRIPE:
    enabled: true
  MANUAL:
    enabled: true
parameters:
  messaging.email.fromName: "Club Fictici Cua"
  levels.enabled: false
  waitlist.mode: "FIFO"
# Fictional identities only. Password values come from the process environment.
