# Local consumer variant of club-canic.yaml; only the two routing hosts differ.
# Product defaults equal the Cànic catalog values; no parameter overrides are needed.
# Theme tokens: docs/pantalles/mobil/01-acces.html :root.
apiVersion: "agilityhub.club/v1"
club:
  slug: "canic"
  name: "Club Agility Cànic"
  address: {city: "Cabrera de Mar", country: "ES"}
  locales:
    - "ca"
    - "es"
  defaultLocale: "ca"
  timeZone: "Europe/Madrid"
  currency: "EUR"
  countryProfile: "ES"
  status: "ONBOARDING"
  template: false
  contactEmail: "canic@example.test"
domains:
  -
    host: "app.example.test"
    app: "clubs"
    primary: true
  -
    host: "admin.example.test"
    app: "clubs-admin"
    primary: false
theme:
  colors:
    primary: "#E26A2A"
    onPrimary: "#FFFFFF"
    background: "#0B0B0B"
    surface: "#161616"
    surfaceAlt: "#1E1E1E"
    text: "#FFFFFF"
    textMuted: "#B5B5B5"
    border: "#2B2B2B"
    success: "#4CAF7D"
    warning: "#E5B93C"
    danger: "#E05B5B"
    info: "#85B8E8"
  fontFamily: "Montserrat"
  radius: "4px"
  ringPalette:
    - "#F2B58C"
    - "#8FCE8F"
    - "#C9CDD3"
    - "#F5D67A"
    - "#85B8E8"
  mode: "dark"
preset: "CANIC"
paymentProviders:
  - "SEPA_XML"
  - "MANUAL"
parameters: {}
# Fictional identities only. Password values come from the process environment.
