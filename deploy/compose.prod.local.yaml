# Local only: use with compose.prod.yaml, never on the release host.
services:
  core:
    environment: &local-environment
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATA_MONGODB_URI: ${LOCAL_MONGODB_URI:?Set LOCAL_MONGODB_URI with URL-encoded credentials}
      AUTH_ISSUER: https://id.localhost:${LOCAL_HTTPS_PORT:-8443}
      OIDC_LOGIN_URL: https://id.localhost:${LOCAL_HTTPS_PORT:-8443}/login
      OIDC_ID_WEB_REDIRECT_URI: https://id.localhost:${LOCAL_HTTPS_PORT:-8443}/oidc/callback
      OIDC_ID_WEB_LOGOUT_URI: https://id.localhost:${LOCAL_HTTPS_PORT:-8443}/
      OIDC_CLUBS_APP_REDIRECT_URI: https://clubs.localhost:${LOCAL_HTTPS_PORT:-8443}/oidc/callback
      OIDC_CLUBS_APP_LOGOUT_URI: https://clubs.localhost:${LOCAL_HTTPS_PORT:-8443}/
      OIDC_CLUBS_ADMIN_REDIRECT_URI: https://clubsadmin.localhost:${LOCAL_HTTPS_PORT:-8443}/oidc/callback
      OIDC_CLUBS_ADMIN_LOGOUT_URI: https://clubsadmin.localhost:${LOCAL_HTTPS_PORT:-8443}/
      # Like the consumer stack, only ID is global; the two other local hosts belong to the demo club.
      CORS_PLATFORM_HOSTS: id.localhost
      SENDGRID_API_KEY: ""
      SENDGRID_WEBHOOK_PUBLIC_KEY: ""
      TWILIO_ACCOUNT_SID: ""
      TWILIO_AUTH_TOKEN: ""
      TWILIO_MESSAGING_SERVICE_SID: ""
      SMS_ALLOWED_NUMBERS: ""
      VAPID_PUBLIC_KEY: ""
      VAPID_PRIVATE_KEY: ""
      VAPID_SUBJECT: ""
      MAIL_LOCAL_DIRECTORY: /app/mailbox
      EXPORT_LOCAL_DIRECTORY: /app/exports
      ATTACHMENT_LOCAL_DIRECTORY: /app/attachments
      SHARED_SCHEDULING_ENABLED: "false"
    volumes:
      - mailbox:/app/mailbox
      - exports:/app/exports
      - attachments:/app/attachments
    depends_on:
      local-hosts:
        condition: service_completed_successfully
  seed:
    image: ghcr.io/jboixtcm/agilityhub-core-api:${IMAGE_TAG}
    environment:
      <<: *local-environment
      SEED_PASSWORD: ${SEED_PASSWORD:?Set a fictional local SEED_PASSWORD}
      OIDC_MASTER_KEY: ${OIDC_MASTER_KEY}
      SIGNUP_CAPABILITY_KEY: ${SIGNUP_CAPABILITY_KEY}
      BOOKING_CALENDAR_KEY: ${BOOKING_CALENDAR_KEY}
      EMAIL_UNSUBSCRIBE_KEY: ${EMAIL_UNSUBSCRIBE_KEY}
      BILLING_BANK_KEY: ${BILLING_BANK_KEY}
    volumes:
      - exports:/app/exports
      - attachments:/app/attachments
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        java -jar /app/app.jar --core.command=club:apply /app/seeds/club-canic.yaml
        java -jar /app/app.jar --core.command=seed:demo --club=canic --seed=42
    healthcheck:
      disable: true
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
  local-hosts:
    # The real domain admission policy reserves localhost. Only this disposable
    # local fixture maps the seeded tenant before Core starts; no release hook.
    image: mongo:7.0
    environment:
      LOCAL_MONGODB_URI: ${LOCAL_MONGODB_URI}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-agilityhub}
    volumes:
      - ./local/hosts.js:/opt/local-hosts.js:ro
    entrypoint: [mongosh, --quiet, --nodb, /opt/local-hosts.js]
    restart: "no"
    depends_on:
      seed:
        condition: service_completed_successfully
  caddy:
    environment:
      ACME_EMAIL: operator@example.test
      CADDY_LOCAL_OPTIONS: local_certs
      ID_HOST: id.localhost
      CLUBS_HOST: clubs.localhost
      ADMIN_HOST: clubsadmin.localhost
      CORE_HOST: core.localhost
      CLUB_ADMIN_HOSTS: unused.invalid
    ports: !override
      - 127.0.0.1:${LOCAL_HTTP_PORT:-8088}:80
      - 127.0.0.1:${LOCAL_HTTPS_PORT:-8443}:443
    volumes:
      - ./local/id:/srv/id:ro
      - ./local/clubs:/srv/clubs:ro
      - ./local/clubsadmin:/srv/clubsadmin:ro
  minio:
    image: agilityhub-minio:2025-10-15-local
    build:
      context: ./local
      dockerfile: Dockerfile.minio
    command: [server, /data]
    environment:
      MINIO_ROOT_USER: ${BACKUP_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${BACKUP_S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 3s
      timeout: 3s
      retries: 30
  backup:
    environment:
      BACKUP_S3_ENDPOINT: http://minio:9000
volumes:
  mailbox:
  exports:
  attachments:
  minio-data:
