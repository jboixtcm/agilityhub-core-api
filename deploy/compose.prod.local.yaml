# Local only: use with compose.prod.yaml, never on the release host.
services:
  core:
    environment: &local-environment
      SPRING_PROFILES_ACTIVE: prod
      AUTH_ISSUER: https://id.localhost
      OIDC_LOGIN_URL: https://id.localhost/login
      OIDC_ID_WEB_REDIRECT_URI: https://id.localhost/oidc/callback
      OIDC_ID_WEB_LOGOUT_URI: https://id.localhost/
      OIDC_CLUBS_APP_REDIRECT_URI: https://clubs.localhost/oidc/callback
      OIDC_CLUBS_APP_LOGOUT_URI: https://clubs.localhost/
      OIDC_CLUBS_ADMIN_REDIRECT_URI: https://clubsadmin.localhost/oidc/callback
      OIDC_CLUBS_ADMIN_LOGOUT_URI: https://clubsadmin.localhost/
      # Like the consumer stack, only ID is global; the two other local hosts belong to the demo club.
      CORS_PLATFORM_HOSTS: id.localhost
      SMS_ALLOWED_NUMBERS: ""
      BILLING_SECRETS_KEY: ${BILLING_SECRETS_KEY}
      EXPORT_S3_BUCKET: fictional-exports
      EXPORT_S3_ENDPOINT: http://minio:9000
      EXPORT_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY}
      EXPORT_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY}
      ATTACHMENT_S3_BUCKET: fictional-attachments
      ATTACHMENT_S3_ENDPOINT: http://minio:9000
      ATTACHMENT_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY}
      ATTACHMENT_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY}
      SHARED_SCHEDULING_ENABLED: "false"
    depends_on:
      local-hosts:
        condition: service_completed_successfully
  seed:
    image: ghcr.io/jboixtcm/agilityhub-core-api:${IMAGE_TAG}
    environment:
      <<: *local-environment
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATA_MONGODB_URI: ${LOCAL_MONGODB_URI:?Set LOCAL_MONGODB_URI with URL-encoded credentials}
      EXPORT_LOCAL_DIRECTORY: /app/exports
      ATTACHMENT_LOCAL_DIRECTORY: /app/attachments
      SEED_PASSWORD: ${SEED_PASSWORD:?Set a fictional local SEED_PASSWORD}
      OIDC_MASTER_KEY: ${OIDC_MASTER_KEY}
      SIGNUP_CAPABILITY_KEY: ${SIGNUP_CAPABILITY_KEY}
      BOOKING_CALENDAR_KEY: ${BOOKING_CALENDAR_KEY}
      EMAIL_UNSUBSCRIBE_KEY: ${EMAIL_UNSUBSCRIBE_KEY}
      BILLING_BANK_KEY: ${BILLING_BANK_KEY}
    volumes:
      - exports:/app/exports
      - attachments:/app/attachments
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        java -jar /app/app.jar --core.command=club:apply /app/seeds/club-canic.yaml
        java -jar /app/app.jar --core.command=seed:demo --club=canic --seed=42
    healthcheck:
      disable: true
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
  local-hosts:
    # The real domain admission policy reserves localhost. Only this disposable
    # local fixture maps the seeded tenant before Core starts; no release hook.
    image: mongo:7.0.41@sha256:8102f674c3d5b5c3b5a248397778b8d148a998c6409f390ff62628eb617f0847
    pull_policy: never
    environment:
      LOCAL_MONGODB_URI: ${LOCAL_MONGODB_URI}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-agilityhub}
    volumes:
      - ./local/hosts.js:/opt/local-hosts.js:ro
    entrypoint: [mongosh, --quiet, --nodb, /opt/local-hosts.js]
    restart: "no"
    depends_on:
      seed:
        condition: service_completed_successfully
  caddy:
    # Docker Desktop needs a non-internal bridge for published loopback ports.
    # Only the proxy joins it; Core retains no provider egress.
    networks:
      ingress: {}
    depends_on:
      ask-stub:
        condition: service_started
    environment:
      ACME_EMAIL: operator@example.test
      CADDY_LOCAL_OPTIONS: local_certs
      CADDY_ASK_UPSTREAM: ask-stub:8080
      ID_HOST: id.localhost
      CLUBS_HOST: clubs.localhost
      ADMIN_HOST: clubsadmin.localhost
      CORE_HOST: core.localhost
      CLUB_ADMIN_HOSTS: unused.invalid
    ports: !override
      - 127.0.0.1:${LOCAL_HTTP_PORT:-8088}:80
      - 127.0.0.1:${LOCAL_HTTPS_PORT:-8443}:443
    volumes:
      - ./local/id:/srv/id:ro
      - ./local/clubs:/srv/clubs:ro
      - ./local/clubsadmin:/srv/clubsadmin:ro
  ask-stub:
    image: python:3.12-slim
    command: [python, -B, /ask.py]
    volumes:
      - ./local/ask.py:/ask.py:ro
    restart: "no"
  minio:
    image: agilityhub-minio:2025-10-15-local
    build:
      context: ./local
      dockerfile: Dockerfile.minio
    command: [server, /data]
    environment:
      MINIO_ROOT_USER: ${BACKUP_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${BACKUP_S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 3s
      timeout: 3s
      retries: 30
  backup:
    environment:
      BACKUP_S3_ENDPOINT: http://minio:9000
volumes:
  exports:
  attachments:
  minio-data:
networks:
  default:
    internal: true
  ingress: {}
