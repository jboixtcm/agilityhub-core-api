services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "${MONGODB_REPLICA_SET:-rs0}", "--bind_ip_all"]
    environment:
      MONGODB_REPLICA_SET: ${MONGODB_REPLICA_SET:-rs0}
    ports:
      - "127.0.0.1:${MONGO_PORT:-${MONGODB_PORT:-27017}}:27017"
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo-healthcheck.js:/opt/mongo-healthcheck.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "/opt/mongo-healthcheck.js"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12

  api:
    build: .
    volumes:
      - export-files:/app/exports
      - attachment-files:/app/attachments
    environment:
      SPRING_PROFILES_ACTIVE: local
      ATTACHMENT_LOCAL_DIRECTORY: /app/attachments
      EXPORT_LOCAL_DIRECTORY: /app/exports
      SERVER_PORT: ${SERVER_PORT:-8080}
      AUTH_ISSUER: ${AUTH_ISSUER:-https://id.agilitydoghub.com}
      OIDC_MASTER_KEY: ${OIDC_MASTER_KEY:-}
      OIDC_LEARN_CLIENT_SECRET: ${OIDC_LEARN_CLIENT_SECRET:-}
      OIDC_LOGIN_URL: ${OIDC_LOGIN_URL:-https://id.agilitydoghub.com/login}
      OIDC_CLUBS_APP_REDIRECT_URI: ${OIDC_CLUBS_APP_REDIRECT_URI:-https://clubs.agilitydoghub.com/oidc/callback}
      OIDC_CLUBS_APP_LOGOUT_URI: ${OIDC_CLUBS_APP_LOGOUT_URI:-https://clubs.agilitydoghub.com/}
      OIDC_CLUBS_ADMIN_REDIRECT_URI: ${OIDC_CLUBS_ADMIN_REDIRECT_URI:-https://clubsadmin.agilitydoghub.com/oidc/callback}
      OIDC_CLUBS_ADMIN_LOGOUT_URI: ${OIDC_CLUBS_ADMIN_LOGOUT_URI:-https://clubsadmin.agilitydoghub.com/}
      OIDC_ID_WEB_REDIRECT_URI: ${OIDC_ID_WEB_REDIRECT_URI:-https://id.agilitydoghub.com/oidc/callback}
      OIDC_ID_WEB_LOGOUT_URI: ${OIDC_ID_WEB_LOGOUT_URI:-https://id.agilitydoghub.com/}
      OIDC_AR_APP_REDIRECT_URI: ${OIDC_AR_APP_REDIRECT_URI:-https://ar.agilitydoghub.com/oidc/callback}
      OIDC_AR_APP_LOGOUT_URI: ${OIDC_AR_APP_LOGOUT_URI:-https://ar.agilitydoghub.com/}
      OIDC_LEARN_REDIRECT_URI: ${OIDC_LEARN_REDIRECT_URI:-https://learn.agilitydoghub.com/oidc/callback}
      OIDC_LEARN_LOGOUT_URI: ${OIDC_LEARN_LOGOUT_URI:-https://learn.agilitydoghub.com/}
      MONGODB_HOST: mongo
      MONGODB_PORT: 27017
      MONGODB_DATABASE: ${MONGODB_DATABASE:-agilityhub}
      MONGODB_REPLICA_SET: ${MONGODB_REPLICA_SET:-rs0}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
  export-files:
  attachment-files:
